<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width:200px;
            height:100px;
            border:2px solid white;
            border-radius:50%;
            animation:glowbox 2s infinite ease-in-out;
        }
        @keyframes glowbox{
            from{
                box-shadow:0 0 5px cyan, 0 0  10px cyan,transfer:trnaslate
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
