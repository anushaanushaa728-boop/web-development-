<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color:red;
            width:200px;
            height:100px;
            animation-name:changecolor;
            animation-duration:5s;
            animation-iteration-count:infinite;
        }
        @keyframes changecolor{
            from{background-color:blue;}
            to{background-color:green;}
        }
        @keyframes changecolor{
            0%{background-color:blueviolet;}
            25%{background-color:purple;}
            50%{background-color:indigo;}
            75%{background-color:blue;}
            100%{background-color:green;}
        }
        @keyframes chnagecolor{
            0%{transform:translate(0); background-color:burlywood;}
            50%{transform:translate(100px); background-color:lightcoral;}
            100%{transform:translate(200px); background-color:lightgreen;}

        }
    </style>
</head>
<body>
    <div class="box">.</div>
    <strong>Animation effect goes back to its original form after completion</strong>
</body>
</html>
