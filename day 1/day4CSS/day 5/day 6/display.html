<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p.ex1{
            display:block;
            background-color:chocolate;
        }
        p.ex3{
            display:inline;
            background-color:aqua;
        }
    </style>
</head>
<body>
    <h1>Display:None</h1>
    <div>
        Here display none means nothing to display
        <p class="ex1">Hello Display:None</p>
    </div>
    <h1>display:Block</h1>
    <p class="ex1">Hello Display:Block</p>
    <h1>display:Inline</h1>
    <p class="ex3">Hello Display:Inline</p>
</body>
</html>
