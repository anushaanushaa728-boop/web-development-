<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball{
            width:50px;
            height:100px;
            border-radius:50%;
            background-color:red;
            animation:bounce 2s infinite;
        }
        @keyframes bounce{
            0%{opacity:1;background-color:bisque;}
            50%{opacity:0;}
            75%{opacity:2;background-color:blue;}


        }
    </style>
</head>
<body>
    <div class="ball">

    </div>
</body>
</html>
