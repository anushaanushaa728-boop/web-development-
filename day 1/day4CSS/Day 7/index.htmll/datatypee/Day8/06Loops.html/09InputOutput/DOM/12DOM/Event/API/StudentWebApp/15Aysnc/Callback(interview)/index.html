<body>
    <script>
        //callback:callback is function and it is passed as parameter(callback) into another function

        function DoHomeWork(Subject,callback){
            console.log("Doing home work for $(subject)")

            callback()  //calling the callback function
        }
        DoHomeWork("Maths",function(){
            console.log("Homework done going to play")
        })
    </script>
